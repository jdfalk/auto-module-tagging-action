# file: .github/workflows/ci.yml
# version: 1.1.0
# guid: c5d6e7f8-a9b0-1234-c890-345678901234

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Validate action.yml
        run: |
          if [ ! -f action.yml ]; then
            echo "Error: action.yml not found"
            exit 1
          fi
          echo "✅ action.yml validation passed"

  test:
    name: Test Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Create test monorepo structure
        run: |
          mkdir -p test-repo/modules/{module-a,module-b,module-c}

          # Create module-a
          cd test-repo/modules/module-a
          cat > go.mod << 'EOF'
          module github.com/test/repo/modules/module-a

          go 1.23
          EOF

          cat > main.go << 'EOF'
          package main

          func main() {}
          EOF

          # Create module-b
          cd ../module-b
          cat > go.mod << 'EOF'
          module github.com/test/repo/modules/module-b

          go 1.23
          EOF

          cat > main.go << 'EOF'
          package main

          func main() {}
          EOF

      - name: Test action execution
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          detect-modules: 'true'
          version-increment: 'patch'
          dry-run: 'true'
          create-release: 'false'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # yamllint is invoked directly rather than through a third-party action.
      # This repo's Actions policy is allowed_actions=selected with
      # github_owned_allowed=false, patterns_allowed=[jdfalk/*] and
      # verified_allowed=true. The previous step referenced an UNVERIFIED
      # publisher that does not match jdfalk/*, so GitHub refused to compile
      # this workflow at all: every CI run concluded `startup_failure` with
      # zero jobs, the required status checks never reported, and every PR sat
      # blocked. Found 2026-08-21 by bisection; this job passes under the same
      # policy once the blocked action reference is gone.
      - name: Run yamllint
        run: |
          pipx install yamllint
          yamllint action.yml
